name: Hareket testi (2.5D)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kokoro-depth-v2
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt
      - name: Render test shots
        run: PYTHONPATH=. python scripts/motion_test.py
      - name: Publish test shots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd work/motion_test
          ffmpeg -y -loglevel error -i shot_v0.mp4 -i shot_v2.mp4 -i shot_v6.mp4 -filter_complex "[0:v][1:v][2:v]concat=n=3:v=1[v]" -map "[v]" -c:v libx264 -crf 20 -pix_fmt yuv420p motion_test.mp4
          gh release view motion-test >/dev/null 2>&1 || gh release create motion-test --prerelease --title "Motion test" --notes "2.5D test shots"
          gh release upload motion-test motion_test.mp4 test.depth.png --clobber
