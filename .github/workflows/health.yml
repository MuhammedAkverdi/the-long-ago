name: 6 - Haftalık sağlık kontrolü
on:
  schedule:
    - cron: "15 7 * * 0"   # Sundays 10:15 TR
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: health
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          grep -vE '^(kokoro|soundfile)' requirements.txt > "$RUNNER_TEMP/req.txt"
          pip install -q -r "$RUNNER_TEMP/req.txt"
      - name: Run
        run: python -m pipeline health
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          UPLOAD_MODE: ${{ vars.UPLOAD_MODE }}
          GH_TOKEN: ${{ github.token }}
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WF: ${{ github.workflow }}
        run: bash scripts/report_failure.sh "$WF" "$URL"
